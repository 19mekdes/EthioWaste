<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Waste Management & Urban Recycling - Addis Ababa</title>
    <meta name="description" content="Empowering citizens, collectors, recycling facilities, and municipal authorities with real-time waste management and recycling operations." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #07864b;
      --dark-green: #073b32;
      --light-green: #eaf7ef;
      --text: #173b38;
      --white: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      line-height: 1.6;
      background: var(--white);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    /* Navigation */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 7%;
      background: white;
      box-shadow: 0 2px 12px #0000000b;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: var(--dark-green);
    }

    .logo span {
      color: var(--green);
    }

    .tagline {
      display: block;
      font-size: 11px;
      font-weight: normal;
      color: #647773;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    nav a:hover {
      color: var(--green);
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 11px 22px;
      border: 1px solid var(--green);
      border-radius: 7px;
      background: var(--green);
      color: white;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn:hover {
      background: #066b3d;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--green);
    }

    .menu-toggle {
      display: none;
      border: none;
      background: transparent;
      color: var(--dark-green);
      font-size: 26px;
    }

    /* Hero section */
    .hero {
      min-height: 430px;
      display: flex;
      align-items: center;
      padding: 65px 9%;
      color: white;
      background:
        linear-gradient(90deg, #052f29 0%, #052f29df 40%, #052f2960 100%),
        linear-gradient(135deg, #14794c, #83b77d);
    }

    .hero-content {
      max-width: 650px;
    }

    .eyebrow {
      color: #7be0aa;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 15px 0;
      font-size: clamp(38px, 5vw, 60px);
      line-height: 1.1;
    }

    .hero h1 span {
      color: #71dfa3;
    }

    .hero p {
      max-width: 540px;
      margin-bottom: 25px;
      color: #e2eeea;
      font-size: 17px;
    }

    .hero .btn {
      margin-right: 10px;
      background: #65dba0;
      color: #073b32;
      border-color: #65dba0;
    }

    .hero .btn-outline {
      background: transparent;
      border-color: white;
      color: white;
    }

    /* Services */
    .services {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      padding: 55px 8%;
    }

    .service-card {
      padding: 20px 15px;
      text-align: center;
      border-right: 1px solid #e6eeea;
    }

    .service-card:last-child {
      border-right: none;
    }

    .service-icon {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: var(--light-green);
      color: var(--green);
      font-size: 29px;
    }

    .service-card h3 {
      margin-bottom: 9px;
      font-size: 17px;
    }

    .service-card p {
      color: #61746f;
      font-size: 14px;
    }

    /* How it works */
    .how-it-works {
      padding: 55px 8%;
      background: #f0f8f3;
    }

    .section-heading {
      margin-bottom: 35px;
      text-align: center;
    }

    .section-heading p {
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin-top: 7px;
      font-size: 30px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .step {
      padding: 20px;
    }

    .step-number {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      margin-bottom: 13px;
      border-radius: 50%;
      background: var(--green);
      color: white;
      font-weight: bold;
    }

    .step h3 {
      margin-bottom: 8px;
      font-size: 17px;
    }

    .step p {
      color: #61746f;
      font-size: 14px;
    }

    /* Call to action */
    .cta {
      padding: 55px 8%;
      text-align: center;
    }

    .cta h2 {
      margin-bottom: 12px;
      font-size: 29px;
    }

    .cta p {
      margin-bottom: 22px;
      color: #61746f;
    }

    /* Footer */
    footer {
      padding: 35px 8% 20px;
      background: var(--dark-green);
      color: white;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      font-size: 14px;
    }

    .footer-links a:hover {
      color: #71dfa3;
    }

    .copyright {
      margin-top: 25px;
      padding-top: 18px;
      border-top: 1px solid #ffffff24;
      text-align: center;
      color: #c4d9d1;
      font-size: 12px;
    }

    /* Responsive design */
    @media (max-width: 850px) {
      header {
        padding: 15px 5%;
      }

      .menu-toggle {
        display: block;
      }

      nav {
        display: none;
        position: absolute;
        top: 75px;
        left: 0;
        right: 0;
        z-index: 10;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 15px 5%;
        background: white;
        box-shadow: 0 8px 15px #00000012;
      }

      nav.open {
        display: flex;
      }

      nav a {
        padding: 12px 0;
      }

      .nav-buttons {
        margin-top: 10px;
      }

      .services,
      .steps {
        grid-template-columns: repeat(2, 1fr);
      }

      .service-card {
        border-right: none;
      }
    }

    @media (max-width: 520px) {
      .hero {
        min-height: 400px;
        padding: 55px 7%;
      }

      .hero p {
        font-size: 15px;
      }

      .services,
      .steps {
        grid-template-columns: 1fr;
        padding: 35px 7%;
      }

      .how-it-works {
        padding: 40px 5%;
      }

      .section-heading h2,
      .cta h2 {
        font-size: 25px;
      }

      .footer-content {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
  </head>
  <body class="bg-brand-dark text-slate-100 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx">
    </script>
  </body>
</html>
